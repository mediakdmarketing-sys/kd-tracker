name: Scheduled jobs

# Replaces the in-process node-cron scheduler (src/jobs/scheduler.js) when the API runs on
# Vercel, where the process is frozen between requests. Each run executes the same job code
# (backend/src/jobs/run.js) directly against Supabase and the Backblaze bucket.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL   S3_ENDPOINT   S3_ACCESS_KEY   S3_SECRET_KEY
# Optional repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   S3_BUCKET (default kd-tracker-captures)   S3_REGION (default us-east-005)
#   RETENTION_DAYS (default 7)

on:
  schedule:
    - cron: '15 2 * * *'   # purge         - daily 02:15 UTC
    - cron: '10 * * * *'   # close-shifts  - hourly at :10
    - cron: '0 3 1 * *'    # payroll       - 1st of month 03:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        type: choice
        options: [purge, close-shifts, payroll]
        default: purge

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pick job from schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "15 2 * * *") echo "job=purge" >> "$GITHUB_OUTPUT" ;;
            "10 * * * *") echo "job=close-shifts" >> "$GITHUB_OUTPUT" ;;
            "0 3 1 * *")  echo "job=payroll" >> "$GITHUB_OUTPUT" ;;
            *)            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Run ${{ steps.pick.outputs.job }}
        working-directory: backend
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          DB_CLIENT: pg
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_DRIVER: s3
          S3_BUCKET: ${{ vars.S3_BUCKET || 'kd-tracker-captures' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-005' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '7' }}
        run: node src/jobs/run.js "${{ steps.pick.outputs.job }}"
