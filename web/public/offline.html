<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · KD Tracker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7f9; color: #16191d;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid #e2e5ea; border-radius: 12px;
      padding: 40px 32px; max-width: 380px; width: 100%; text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p  { color: #5c6472; font-size: 14px; line-height: 1.55; margin-bottom: 24px; }
    button {
      background: #2f5cff; color: #fff; border: none; border-radius: 8px;
      padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2650e0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>No connection</h1>
    <p>KD Tracker can't reach the server right now. Check your network and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
