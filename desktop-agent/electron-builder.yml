# Packaging config for the desktop agent (Sprint 7, story G-9).
#
# `npm run build:win|mac|linux` builds only for the current host's platform unless you have
# cross-build tooling set up (Wine for Windows-from-Linux, etc.) — electron-builder can only
# reliably produce a *signed* macOS build on macOS itself. This repo has no signing identity
# configured for any platform: builds are unsigned, which is fine for internal distribution
# but will trigger Gatekeeper/SmartScreen warnings. Add signing before a public release.

appId: com.kdmarketing.workbuddy
productName: WorkBuddy
copyright: Copyright (c) 2026 KD Marketing

directories:
  output: dist
  buildResources: build

# A single 1024x1024 source PNG. electron-builder converts it to .ico for Windows and .icns
# for macOS automatically; Linux uses PNGs directly.
icon: build/icon.png

# Auto-update feed: a static folder (e.g. a public Cloudflare R2 bucket) holding the installer,
# its .blockmap and the latest.yml electron-builder writes into dist/. Upload all three after
# each build. The URL here is only baked into app-update.yml; the agent itself reads
# `updateUrl` from src/config/defaults.json (or KD_UPDATE_URL), so set that one too.
# Nothing is ever uploaded by `build:*`; publishing is manual.
publish:
  provider: generic
  url: https://updates.example.com/workbuddy

# Registers workbuddy:// with the OS on install, so the web portal can sign the agent in after an
# employee signs in there (see src/core/connectLink.js).
protocols:
  - name: WorkBuddy
    schemes:
      - workbuddy

# Do not recompile native modules at package time. active-win and uiohook-napi are N-API
# modules that ship prebuilt binaries (the same .node file loads in Electron and plain Node),
# and sql.js is pure WASM. Rebuilding from source needs Visual Studio Build Tools plus a Python
# with distutils (gone in 3.12+), and fails on machines and CI runners that lack them.
npmRebuild: false

files:
  - src/**/*
  - package.json
  - '!src/**/*.test.js'

# better-sqlite3 ships a native .node binary that must exist as a real file on disk to be
# loaded — inside an asar archive it cannot be dlopen'd. Unpacking just the compiled binary
# would still leave its sibling files (package.json, the JS loader) inside the archive trying
# to resolve a path that no longer matches, so the whole package is unpacked.
asarUnpack:
  - node_modules/better-sqlite3/**/*
  # active-win shells out to a bundled helper binary (Windows/macOS), which cannot execute
  # from inside an asar archive.
  - node_modules/active-win/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # A tray app with no windows to speak of — nothing useful to pin to the desktop.
  createDesktopShortcut: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  icon: build/icon.png
  # The text macOS shows in its permission prompts. Without a usage description for the
  # microphone, macOS can terminate the app the moment it asks for access.
  extendInfo:
    NSMicrophoneUsageDescription: WorkBuddy records short audio samples during your shift, only if you accepted audio monitoring.
    NSScreenCaptureUsageDescription: WorkBuddy takes screenshots during your shift so your attendance can be reviewed.
  # No Developer ID configured. Without this, an unsigned build on some electron-builder
  # versions still attempts ad-hoc signing and can fail confusingly on a CI box with no
  # keychain at all.
  identity: null
  hardenedRuntime: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  maintainer: KD Marketing IT
