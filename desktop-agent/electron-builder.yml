# Packaging config for the desktop agent (Sprint 7, story G-9).
#
# `npm run build:win|mac|linux` builds only for the current host's platform unless you have
# cross-build tooling set up (Wine for Windows-from-Linux, etc.) — electron-builder can only
# reliably produce a *signed* macOS build on macOS itself. This repo has no signing identity
# configured for any platform: builds are unsigned, which is fine for internal distribution
# but will trigger Gatekeeper/SmartScreen warnings. Add signing before a public release.

appId: com.kdmarketing.tracker
productName: KD Tracker
copyright: Copyright (c) 2026 KD Marketing

directories:
  output: dist
  buildResources: build

# A single 1024x1024 source PNG (build/icon.png, generated by build/generate-icon.js).
# electron-builder converts it to .ico for Windows and .icns for macOS automatically; Linux
# uses PNGs directly. Replace build/icon.png with a real logo whenever one exists.
icon: build/icon.png

# No auto-update server wired up yet (icebox) — never publish on a plain `build`.
publish: null

files:
  - src/**/*
  - package.json
  - '!src/**/*.test.js'

# better-sqlite3 ships a native .node binary that must exist as a real file on disk to be
# loaded — inside an asar archive it cannot be dlopen'd. Unpacking just the compiled binary
# would still leave its sibling files (package.json, the JS loader) inside the archive trying
# to resolve a path that no longer matches, so the whole package is unpacked.
asarUnpack:
  - node_modules/better-sqlite3/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # A tray app with no windows to speak of — nothing useful to pin to the desktop.
  createDesktopShortcut: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  icon: build/icon.png
  # No Developer ID configured. Without this, an unsigned build on some electron-builder
  # versions still attempts ad-hoc signing and can fail confusingly on a CI box with no
  # keychain at all.
  identity: null
  hardenedRuntime: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  maintainer: KD Marketing IT
