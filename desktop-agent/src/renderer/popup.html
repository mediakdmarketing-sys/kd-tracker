<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KD Tracker</title>
    <style>
      :root {
        /* Light only, matching the web portal's own choice — the tray popup and the browser
           portal should look like the same product regardless of the OS theme. */
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #fff;
        --border: #e2e5ea;
        --text: #16191d;
        --muted: #5c6472;
        --accent: #2f5cff;
        --ok: #12805c;
        --warn: #a4610a;
        --danger: #b4231f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px;
        background: var(--bg);
        color: var(--text);
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .muted { color: var(--muted); }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .clock { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
      label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
      input {
        width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
        background: var(--bg); color: var(--text); font: inherit; margin-bottom: 10px;
      }
      button {
        padding: 9px 14px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--surface); color: var(--text); font: inherit; font-weight: 550; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .danger { background: var(--danger); border-color: var(--danger); color: #fff; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .pill {
        display: inline-block; padding: 2px 9px; border-radius: 999px;
        font-size: 11px; font-weight: 650;
      }
      .pill-ok { background: rgba(18,128,92,.14); color: var(--ok); }
      .pill-warn { background: rgba(164,97,10,.14); color: var(--warn); }
      .pill-danger { background: rgba(180,35,31,.14); color: var(--danger); }
      .kv { display: flex; justify-content: space-between; padding: 4px 0; }
      .error { color: var(--danger); margin-bottom: 10px; }
      .hint { font-size: 11px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
